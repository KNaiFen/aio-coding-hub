name: Temporary signing secret migration

# TEMPORARY: remove this workflow, its helper, and all RELEASE_SIGNING_MIGRATION_*
# Environment variables after the gated probe and repository-secret deletion succeed.
run-name: Temporary signing secret migration (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: One-time migration operation
        required: true
        type: choice
        options:
          - seal-repository-secrets
          - probe-environment-secrets

permissions: {}

concurrency:
  group: temporary-release-signing-secret-migration
  cancel-in-progress: false

# Reviewed against the release-signing Environment public-key API. The operator
# must re-read the API and require this exact pair immediately before dispatch.
env:
  REVIEWED_ENVIRONMENT_PUBLIC_KEY: "8mwZgQXTC//MSfF29jGwXD+2TsXKffk4ORopLRgfgAs="
  REVIEWED_ENVIRONMENT_KEY_ID: "3380204578043523366"

jobs:
  authorize:
    name: Authorize canonical current main
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require canonical current main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MIGRATION_ACTOR: ${{ github.actor }}
          MIGRATION_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const canonicalOwner = "KNaiFen";
            const canonicalRepo = "aio-coding-hub";
            if (
              context.eventName !== "workflow_dispatch" ||
              context.repo.owner !== canonicalOwner ||
              context.repo.repo !== canonicalRepo ||
              context.ref !== "refs/heads/main" ||
              process.env.MIGRATION_ACTOR !== canonicalOwner ||
              process.env.MIGRATION_TRIGGERING_ACTOR !== canonicalOwner
            ) {
              core.setFailed("This temporary workflow only runs from canonical main.");
              return;
            }

            const { data: repository } = await github.rest.repos.get({
              owner: canonicalOwner,
              repo: canonicalRepo,
            });
            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner: canonicalOwner,
              repo: canonicalRepo,
              branch: "main",
            });
            if (repository.default_branch !== "main" || mainBranch.commit.sha !== context.sha) {
              core.setFailed("The dispatched commit is no longer canonical current main.");
              return;
            }

  seal-repository-secrets:
    name: Seal repository secrets for Environment upload
    if: inputs.operation == 'seal-repository-secrets'
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the immutable workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"

      - name: Install pinned PyNaCl sealed-box implementation
        shell: bash
        run: |
          set -euo pipefail

          wheel_dir="$RUNNER_TEMP/sealed-box-wheels"
          mkdir -p "$wheel_dir"

          download_wheel() {
            local url="$1"
            local destination="$2"
            local expected_sha256="$3"
            local actual_sha256
            curl --fail --location --silent --show-error "$url" --output "$destination"
            actual_sha256="$(sha256sum "$destination")"
            if [[ "${actual_sha256%% *}" != "$expected_sha256" ]]; then
              echo "Pinned sealed-box dependency checksum mismatch." >&2
              exit 1
            fi
          }

          download_wheel \
            "https://files.pythonhosted.org/packages/a0/e3/59cd50310fc9b59512193629e1984c1f95e5c8ae6e5d8c69532ccc65a7fe/pycparser-2.23-py3-none-any.whl" \
            "$wheel_dir/pycparser-2.23-py3-none-any.whl" \
            "e5c6e8d3fbad53479cab09ac03729e0a9faf2bee3db8208a550daf5af81a5934"
          download_wheel \
            "https://files.pythonhosted.org/packages/78/2d/7fa73dfa841b5ac06c7b8855cfc18622132e365f5b81d02230333ff26e9e/cffi-2.0.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            "$wheel_dir/cffi-2.0.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            "3e17ed538242334bf70832644a32a7aae3d83b57567f9fd60a26257e992b79ba"
          download_wheel \
            "https://files.pythonhosted.org/packages/7f/81/d60984052df5c97b1d24365bc1e30024379b42c4edcd79d2436b1b9806f2/pynacl-1.6.2-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            "$wheel_dir/pynacl-1.6.2-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            "22de65bb9010a725b0dac248f353bb072969c94fa8d6b1f34b87d7953cf7bbe4"

          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            "$wheel_dir/pycparser-2.23-py3-none-any.whl" \
            "$wheel_dir/cffi-2.0.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" \
            "$wheel_dir/pynacl-1.6.2-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl"

      - name: Run migration helper self-test
        run: python scripts/seal-environment-secrets.selftest.py

      - name: Reconfirm current main before reading secrets
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner: "KNaiFen",
              repo: "aio-coding-hub",
              branch: "main",
            });
            if (
              context.repo.owner !== "KNaiFen" ||
              context.repo.repo !== "aio-coding-hub" ||
              context.ref !== "refs/heads/main" ||
              mainBranch.commit.sha !== context.sha
            ) {
              core.setFailed("The dispatched commit is no longer canonical current main.");
            }

      - name: Seal both legacy repository secrets
        shell: bash
        env:
          LEGACY_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LEGACY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET_ENVIRONMENT_PUBLIC_KEY: ${{ env.REVIEWED_ENVIRONMENT_PUBLIC_KEY }}
          TARGET_ENVIRONMENT_KEY_ID: ${{ env.REVIEWED_ENVIRONMENT_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          output_dir="$RUNNER_TEMP/signing-secret-migration"
          mkdir -p "$output_dir"
          python scripts/seal-environment-secrets.py \
            --output "$output_dir/release-signing-secrets.json"

      - name: Upload ciphertext-only migration envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signing-secret-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signing-secret-migration/release-signing-secrets.json
          if-no-files-found: error
          retention-days: 1

  probe-environment-secrets:
    name: Probe release-signing Environment secrets
    if: inputs.operation == 'probe-environment-secrets'
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    environment:
      name: release-signing
    steps:
      - name: Check out the immutable workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require API-confirmed writes from one exact sealing run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        # Set this Environment variable to <run_id>:<run_attempt>:<source_sha>
        # only after both secret PUTs and the Environment secret-list check succeed.
        env:
          READY_ENVELOPE: ${{ vars.RELEASE_SIGNING_MIGRATION_READY_ENVELOPE }}
        with:
          script: |
            const match = /^([1-9][0-9]*):([1-9][0-9]*):([0-9a-f]{40})$/.exec(
              process.env.READY_ENVELOPE || '',
            );
            if (!match || match[3] !== context.sha) {
              core.setFailed('Both Environment secret writes must be API-confirmed before the probe.');
              return;
            }
            const runId = Number(match[1]);
            const runAttempt = Number(match[2]);
            const { data: sealingRun } = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                attempt_number: runAttempt,
              },
            );
            if (
              sealingRun.conclusion !== 'success' ||
              sealingRun.event !== 'workflow_dispatch' ||
              sealingRun.head_branch !== 'main' ||
              sealingRun.head_sha !== context.sha ||
              sealingRun.head_repository?.full_name !== 'KNaiFen/aio-coding-hub' ||
              sealingRun.path !== '.github/workflows/migrate-signing-secrets.yml'
            ) {
              core.setFailed('The API-confirmed sealing run provenance is invalid.');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            );
            const expectedName = `release-signing-secret-migration-${runId}-${runAttempt}`;
            const matches = artifacts.filter(
              (artifact) => artifact.name === expectedName && !artifact.expired,
            );
            if (matches.length !== 1) {
              core.setFailed('The exact sealing artifact is unavailable or ambiguous.');
            }

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned Minisign verifier
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz" \
            --output "$archive"
          actual_sha256="$(sha256sum "$archive")"
          if [[ "${actual_sha256%% *}" != "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73" ]]; then
            echo "Pinned Minisign checksum mismatch." >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            "$RUNNER_TEMP/minisign"

      - name: Prepare updater verification key
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/tauri-updater.pub" <<'PY'
          import base64
          import binascii
          import json
          from pathlib import Path
          import sys

          try:
              config = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
              encoded_key = config["plugins"]["updater"]["pubkey"]
              if not isinstance(encoded_key, str):
                  raise ValueError
              public_key = base64.b64decode(encoded_key, validate=True)
              if not public_key.startswith(b"untrusted comment: minisign public key:"):
                  raise ValueError
              if len(public_key) > 512:
                  raise ValueError
              Path(sys.argv[1]).write_bytes(public_key)
          except (KeyError, TypeError, ValueError, binascii.Error, json.JSONDecodeError):
              print("Updater public-key preparation failed.", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Reconfirm current main before using Environment secrets
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner: "KNaiFen",
              repo: "aio-coding-hub",
              branch: "main",
            });
            if (
              context.repo.owner !== "KNaiFen" ||
              context.repo.repo !== "aio-coding-hub" ||
              context.ref !== "refs/heads/main" ||
              mainBranch.commit.sha !== context.sha
            ) {
              core.setFailed("The dispatched commit is no longer canonical current main.");
            }

      - name: Sign and verify an ephemeral probe
        shell: bash
        env:
          ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          python - <<'PY'
          import os

          for name in (
              "ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY",
              "ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
          ):
              value = os.environ.get(name, "")
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}", flush=True)
          PY

          raw_key="${ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY:-}"
          raw_password="${ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          normalized_key="${raw_key//$'\r'/}"
          normalized_key="${normalized_key//$'\n'/}"
          normalized_key="${normalized_key//$'\t'/}"
          normalized_key="${normalized_key// /}"
          if [[ -z "$normalized_key" || -z "$raw_password" ]]; then
            echo "Environment signing-secret probe failed." >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$normalized_key"
          unset \
            ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY \
            ENVIRONMENT_TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          probe_dir="$RUNNER_TEMP/release-signing-probe"
          key_path="$probe_dir/tauri-updater.key"
          payload_path="$probe_dir/probe.txt"
          minisign_signature_path="$probe_dir/probe.minisig"
          mkdir -p "$probe_dir"
          cleanup() {
            rm -f \
              "$key_path" \
              "$payload_path" \
              "$payload_path.sig" \
              "$minisign_signature_path"
          }
          trap cleanup EXIT

          printf '%s' "$normalized_key" > "$key_path"
          printf '%s\n' "release-signing-environment-probe-v1" > "$payload_path"
          if ! pnpm exec tauri signer sign \
            -f "$key_path" \
            -p "$raw_password" \
            "$payload_path" >/dev/null 2>&1; then
            echo "Environment signing-secret probe failed." >&2
            exit 1
          fi
          rm -f "$key_path"
          unset raw_key raw_password normalized_key
          if [[ ! -s "$payload_path.sig" ]]; then
            echo "Environment signing-secret probe failed." >&2
            exit 1
          fi

          python - "$payload_path.sig" "$minisign_signature_path" <<'PY'
          import base64
          import binascii
          from pathlib import Path
          import sys

          try:
              encoded_signature = Path(sys.argv[1]).read_text(encoding="ascii").strip()
              if not encoded_signature or len(encoded_signature) > 4096:
                  raise ValueError
              minisign_signature = base64.b64decode(encoded_signature, validate=True)
              if not minisign_signature.startswith(
                  b"untrusted comment: signature from tauri secret key\n"
              ):
                  raise ValueError
              if len(minisign_signature) > 4096:
                  raise ValueError
              Path(sys.argv[2]).write_bytes(minisign_signature)
          except (binascii.Error, OSError, UnicodeError, ValueError):
              print("Environment signing-secret probe failed.", file=sys.stderr)
              raise SystemExit(1)
          PY

          if ! "$RUNNER_TEMP/minisign" \
            -Vm "$payload_path" \
            -p "$RUNNER_TEMP/tauri-updater.pub" \
            -x "$minisign_signature_path" >/dev/null 2>&1; then
            echo "Environment signing-secret probe failed." >&2
            exit 1
          fi

          echo "Environment signing-secret probe succeeded."
