name: Sync Upstream

on:
  schedule:
    # 每天北京时间 08:00，UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to sync from upstream
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: sync-upstream-${{ github.event.inputs.target_branch || 'main' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: dyndynjyxa/aio-coding-hub
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}

jobs:
  sync:
    name: Sync upstream branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate GitHub App credentials
        shell: bash
        env:
          SYNC_UPSTREAM_APP_ID: ${{ vars.SYNC_UPSTREAM_APP_ID }}
          SYNC_UPSTREAM_APP_PRIVATE_KEY: ${{ secrets.SYNC_UPSTREAM_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SYNC_UPSTREAM_APP_ID" ]] || {
            echo "::error::SYNC_UPSTREAM_APP_ID is not configured."
            exit 1
          }
          [[ "$SYNC_UPSTREAM_APP_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::SYNC_UPSTREAM_APP_ID must be a decimal GitHub App ID."
            exit 1
          }
          [[ -n "$SYNC_UPSTREAM_APP_PRIVATE_KEY" ]] || {
            echo "::error::SYNC_UPSTREAM_APP_PRIVATE_KEY is not configured."
            exit 1
          }

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SYNC_UPSTREAM_APP_ID }}
          private-key: ${{ secrets.SYNC_UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin and upstream
        run: |
          set -euo pipefail

          git check-ref-format --branch "${TARGET_BRANCH}"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git fetch upstream "+refs/heads/${TARGET_BRANCH}:refs/remotes/upstream/${TARGET_BRANCH}"

      - name: Open upstream sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          LOCAL="origin/${TARGET_BRANCH}"
          UPSTREAM="upstream/${TARGET_BRANCH}"
          UPSTREAM_OWNER="${UPSTREAM_REPO%%/*}"
          UPSTREAM_HEAD="${UPSTREAM_OWNER}:${TARGET_BRANCH}"

          echo "Local branch: ${LOCAL}"
          echo "Upstream branch: ${UPSTREAM}"

          create_or_update_upstream_pr() {
            local reason="$1"
            local title="chore(sync): sync upstream ${TARGET_BRANCH}"
            local body
            body="Automatic upstream sync from \`${UPSTREAM_REPO}:${TARGET_BRANCH}\`.

          Reason: ${reason}

          This workflow opened a cross-repository PR instead of pushing directly to \`${TARGET_BRANCH}\`.

          Please review and merge manually."

            local existing_pr
            existing_pr="$(
              gh pr list \
                --repo "${GITHUB_REPOSITORY}" \
                --head "${UPSTREAM_HEAD}" \
                --base "${TARGET_BRANCH}" \
                --state open \
                --json number \
                --jq '.[0].number // empty'
            )"

            local pr_number
            if [ -n "${existing_pr}" ]; then
              gh pr edit "${existing_pr}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${title}" \
                --body "${body}"
              pr_number="${existing_pr}"
            else
              local created_pr_url
              created_pr_url="$(
                gh pr create \
                  --repo "${GITHUB_REPOSITORY}" \
                  --base "${TARGET_BRANCH}" \
                  --head "${UPSTREAM_HEAD}" \
                  --title "${title}" \
                  --body "${body}" \
                  --no-maintainer-edit
              )"

              local created_pr_url_prefix="https://github.com/${GITHUB_REPOSITORY}/pull/"
              if [[ "${created_pr_url}" != "${created_pr_url_prefix}"* ]]; then
                echo "Failed to resolve sync PR number from gh pr create output. Manual handling required." >&2
                exit 1
              fi

              pr_number="${created_pr_url#"$created_pr_url_prefix"}"
              if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
                echo "Failed to resolve sync PR number from gh pr create output. Manual handling required." >&2
                exit 1
              fi
            fi

            local merge_state
            merge_state="$(
              gh pr view "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json mergeStateStatus \
                --jq '.mergeStateStatus'
            )"

            if [ -z "${merge_state}" ] || [ "${merge_state}" = "DIRTY" ] || [ "${merge_state}" = "UNKNOWN" ]; then
              {
                echo "## Sync Upstream"
                echo ""
                echo "Created or updated cross-repository sync PR for \`${TARGET_BRANCH}\`."
                echo ""
                echo "PR: #${pr_number}"
                echo ""
                echo "Manual conflict resolution required; merge state: \`${merge_state:-unavailable}\`."
              } >> "${GITHUB_STEP_SUMMARY}"
              echo "PR #${pr_number} merge state is ${merge_state:-unavailable}. Manual conflict resolution required." >&2
              exit 1
            fi

            {
              echo "## Sync Upstream"
              echo ""
              echo "Created or updated cross-repository sync PR for \`${TARGET_BRANCH}\`."
              echo ""
              echo "Reason: ${reason}"
              echo ""
              echo "PR: #${pr_number}"
              echo ""
              echo "Manual review and merge required."
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          if git merge-base --is-ancestor "${UPSTREAM}" "${LOCAL}"; then
            echo "Already up to date. Nothing to sync."
            {
              echo "## Sync Upstream"
              echo ""
              echo "\`${TARGET_BRANCH}\` is already up to date with \`${UPSTREAM_REPO}:${TARGET_BRANCH}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if git merge-base --is-ancestor "${LOCAL}" "${UPSTREAM}"; then
            echo "Fast-forward sync is possible. Creating a PR for fork semantic review."
            create_or_update_upstream_pr "target branch can be fast-forwarded but requires fork semantic review."
            exit 0
          fi

          echo "Branches have diverged. Creating cross-repository sync PR instead."
          create_or_update_upstream_pr "target branch has local commits and cannot be safely fast-forwarded."
