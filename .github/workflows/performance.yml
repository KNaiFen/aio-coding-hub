name: performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == "refs/heads/main" ]] || {
            echo "::error::Performance runs are restricted to the main branch."
            exit 1
          }

  provider-trend-benchmark:
    needs: main-guard
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev librsvg2-dev patchelf
          if ! sudo apt-get install -y libayatana-appindicator3-dev; then
            sudo apt-get install -y libappindicator3-dev
          fi
          if ! sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev
          fi

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.90.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Provider trend million-row release benchmark
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          cargo test --release --locked --lib \
            provider_trend_million_ledger_rows_release_under_one_second -- \
            --ignored --test-threads=1
          duration_seconds="$(( $(date +%s) - started_at ))"
          {
            echo "## Provider trend benchmark"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Rust: 1.90.0"
            echo "- Duration: ${duration_seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"
