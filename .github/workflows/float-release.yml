name: float-release

on:
  push:
    tags: ['aio-float-v*']

permissions:
  contents: read

concurrency:
  group: float-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate Float release source
        env:
          FLOAT_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/float-release.mjs validate "$FLOAT_TAG"
  build:
    needs: source
    uses: ./.github/workflows/float-build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aio-float-*-${{ github.sha }}
          path: float-downloads
      - name: Verify and assemble packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir float-release
          for platform in windows-x64 macos-arm64; do
            source="float-downloads/aio-float-$platform-${{ github.sha }}"
            (cd "$source" && sha256sum --check SHA256SUMS.txt)
          done
          cp "float-downloads/aio-float-windows-x64-${{ github.sha }}/aio-float-windows-x64.exe" float-release/
          cp "float-downloads/aio-float-macos-arm64-${{ github.sha }}/aio-float-macos-arm64.zip" float-release/
          cd float-release
          sha256sum aio-float-* > SHA256SUMS.txt
      - id: existing
        name: Preserve published release files
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FLOAT_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs');
            const { assessExistingRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-promotion.mjs`);
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.FLOAT_TAG}));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
              return;
            }
            const checksum = release.assets.find(asset => asset.name === 'SHA256SUMS.txt');
            if (!checksum) throw new Error('Existing Float release has no checksums');
            const {data} = await github.rest.repos.getReleaseAsset({...context.repo, asset_id: checksum.id, headers: {accept: 'application/octet-stream'}});
            const result = assessExistingRelease({
              candidateAssetNames: fs.readdirSync('float-release'),
              candidateManifestText: fs.readFileSync('float-release/SHA256SUMS.txt', 'utf8'),
              existingAssetNames: release.assets.map(asset => asset.name),
              existingManifestText: Buffer.from(data).toString('utf8'),
            });
            if (!result.equivalent) throw new Error(`Float release is immutable: ${result.reason}`);
            core.setOutput('publish', 'false');
      - name: Publish independent Float release
        if: steps.existing.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: AIO Float ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          files: float-release/*
          fail_on_unmatched_files: true
          overwrite_files: false
