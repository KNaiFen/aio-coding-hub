name: dev-build

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: Desktop target
        required: true
        type: choice
        default: windows-x64
        options:
          - windows-x64
          - macos-x64
          - macos-arm64
          - linux-x64

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.sha }}-${{ inputs.target_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      target: ${{ steps.target.outputs.target }}
      bundles: ${{ steps.target.outputs.bundles }}
    steps:
      - id: target
        name: Resolve target
        shell: bash
        env:
          TARGET_ID: ${{ inputs.target_id }}
        run: |
          set -euo pipefail
          case "$TARGET_ID" in
            windows-x64)
              echo "runner=windows-latest" >> "$GITHUB_OUTPUT"
              echo "target=x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT"
              echo "bundles=msi" >> "$GITHUB_OUTPUT"
              ;;
            macos-x64)
              echo "runner=macos-latest" >> "$GITHUB_OUTPUT"
              echo "target=x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
              echo "bundles=app" >> "$GITHUB_OUTPUT"
              ;;
            macos-arm64)
              echo "runner=macos-latest" >> "$GITHUB_OUTPUT"
              echo "target=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
              echo "bundles=app" >> "$GITHUB_OUTPUT"
              ;;
            linux-x64)
              echo "runner=ubuntu-22.04" >> "$GITHUB_OUTPUT"
              echo "target=x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
              echo "bundles=deb,appimage" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac

  build:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux system dependencies
        if: inputs.target_id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev librsvg2-dev patchelf
          if ! sudo apt-get install -y libayatana-appindicator3-dev; then
            sudo apt-get install -y libappindicator3-dev
          fi
          if ! sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.90.0
          targets: ${{ needs.plan.outputs.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for unsigned development builds
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('dev-build-overlay.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Build desktop artifact in the cloud
        shell: bash
        run: >-
          pnpm exec tauri build
          --config dev-build-overlay.json
          --target ${{ needs.plan.outputs.target }}
          --bundles ${{ needs.plan.outputs.bundles }}
          -- --locked

      - name: Upload development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-build-${{ inputs.target_id }}-${{ github.sha }}
          path: |
            src-tauri/target/${{ needs.plan.outputs.target }}/release/bundle/**
            src-tauri/target/${{ needs.plan.outputs.target }}/release/*.exe
          if-no-files-found: error
          retention-days: 7
