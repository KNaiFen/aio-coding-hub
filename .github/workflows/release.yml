name: release

on:
  push:
    tags:
      - "aio-coding-hub-v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - id: source
        name: Validate release source
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          git checkout --detach "$source_sha"
          node scripts/support-matrix.mjs validate-release-version --tag "$TAG_NAME"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - id: candidate
        name: Find the successful main CI candidate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.SOURCE_SHA,
              per_page: 100,
            });
            const eligible = runs
              .filter((run) =>
                run.head_sha === process.env.SOURCE_SHA &&
                run.head_branch === 'main' &&
                run.head_repository?.full_name === 'KNaiFen/aio-coding-hub' &&
                ['push', 'workflow_dispatch'].includes(run.event) &&
                run.conclusion === 'success')
              .sort((left, right) => new Date(right.updated_at) - new Date(left.updated_at));

            for (const run of eligible) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              const expected = `release-candidate-${process.env.SOURCE_SHA}-${run.id}-${run.run_attempt}`;
              const matches = artifacts.filter(
                (artifact) => artifact.name === expected && !artifact.expired,
              );
              if (matches.length === 1) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('artifact_id', String(matches[0].id));
                core.setOutput('artifact_name', expected);
                return;
              }
            }
            core.setFailed(`No unexpired release candidate exists for ${process.env.SOURCE_SHA}.`);

      - name: Download the exact CI candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: release-assets

      - name: Verify candidate files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            aio-coding-hub-win64.msi \
            aio-coding-hub-win64.msi.sig \
            aio-coding-hub-win64-portable.zip \
            aio-coding-hub-macos-arm.tar.gz \
            aio-coding-hub-macos-arm.tar.gz.sig \
            aio-coding-hub-macos-arm.zip \
            aio-tui-win64.zip \
            aio-tui-macos-intel.tar.gz \
            aio-tui-macos-arm.tar.gz \
            aio-tui-linux-x64.tar.gz \
            latest.json \
            SHA256SUMS.txt; do
            [[ -s "release-assets/$file" ]] || {
              echo "Missing release candidate file: $file" >&2
              exit 1
            }
          done
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          node -e "JSON.parse(require('fs').readFileSync('release-assets/latest.json', 'utf8'))"

      - name: Publish release without rebuilding
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
