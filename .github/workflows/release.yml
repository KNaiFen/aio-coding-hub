name: release

on:
  push:
    tags:
      - "aio-coding-hub-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage release promotion guard
        shell: bash
        run: cp scripts/release-promotion.mjs "$RUNNER_TEMP/release-promotion.mjs"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - id: source
        name: Validate release source
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^aio-coding-hub-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          tag_ref="refs/tags/$TAG_NAME"
          git fetch --no-tags origin "$tag_ref"
          source_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$source_sha" origin/main
          git checkout --detach "$source_sha"
          node scripts/support-matrix.mjs validate-release-version --tag "$TAG_NAME"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - id: candidate
        name: Find the successful main CI candidate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { selectReleaseCandidate } = await import(
              pathToFileURL(`${process.env.RUNNER_TEMP}/release-promotion.mjs`).href,
            );
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.SOURCE_SHA,
              per_page: 100,
            });
            const eligible = runs
              .filter((run) =>
                run.head_sha === process.env.SOURCE_SHA &&
                run.head_branch === 'main' &&
                run.head_repository?.full_name === 'KNaiFen/aio-coding-hub' &&
                ['push', 'workflow_dispatch'].includes(run.event) &&
                run.conclusion === 'success');

            const candidateRuns = [];
            for (const run of eligible) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              candidateRuns.push({ id: run.id, runAttempt: run.run_attempt, artifacts });
            }
            const candidate = selectReleaseCandidate(candidateRuns, process.env.SOURCE_SHA);
            core.setOutput('run_id', String(candidate.runId));
            core.setOutput('artifact_id', String(candidate.artifactId));
            core.setOutput('artifact_name', candidate.artifactName);

      - name: Download the exact CI candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Verify candidate files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            aio-coding-hub-win64.msi \
            aio-coding-hub-win64.msi.sig \
            aio-coding-hub-win64-portable.zip \
            aio-coding-hub-macos-arm.tar.gz \
            aio-coding-hub-macos-arm.tar.gz.sig \
            aio-coding-hub-macos-arm.zip \
            aio-tui-win64.zip \
            aio-tui-macos-intel.tar.gz \
            aio-tui-macos-arm.tar.gz \
            aio-tui-linux-x64.tar.gz \
            latest.json \
            SHA256SUMS.txt; do
            [[ -s "release-assets/$file" ]] || {
              echo "Missing release candidate file: $file" >&2
              exit 1
            }
          done
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          node -e "JSON.parse(require('fs').readFileSync('release-assets/latest.json', 'utf8'))"

      - id: release-preflight
        name: Verify existing release is immutable
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { readFileSync, readdirSync } = require('node:fs');
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { assessExistingRelease, validateReleaseAssets } = await import(
              pathToFileURL(`${process.env.RUNNER_TEMP}/release-promotion.mjs`).href,
            );
            const candidateDirectory = join(process.env.GITHUB_WORKSPACE, 'release-assets');
            const candidateAssetNames = readdirSync(candidateDirectory, { withFileTypes: true })
              .filter((entry) => entry.isFile())
              .map((entry) => entry.name);
            const candidateManifestText = readFileSync(
              join(candidateDirectory, 'SHA256SUMS.txt'),
              'utf8',
            );
            validateReleaseAssets({
              assetNames: candidateAssetNames,
              manifestText: candidateManifestText,
              label: 'Candidate release',
            });

            let existingRelease;
            try {
              ({ data: existingRelease } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('should_publish', 'true');
                return;
              }
              throw error;
            }

            const checksumAsset = existingRelease.assets.find(
              (asset) => asset.name === 'SHA256SUMS.txt',
            );
            if (!checksumAsset) {
              throw new Error(`Existing release ${process.env.RELEASE_TAG} has no SHA256SUMS.txt`);
            }
            const { data: existingManifest } = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: checksumAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const outcome = assessExistingRelease({
              candidateAssetNames,
              candidateManifestText,
              existingAssetNames: existingRelease.assets.map((asset) => asset.name),
              existingManifestText: Buffer.from(existingManifest).toString('utf8'),
            });
            if (!outcome.equivalent) {
              throw new Error(
                `Existing release ${process.env.RELEASE_TAG} is immutable: ${outcome.reason}`,
              );
            }
            core.info(`Release ${process.env.RELEASE_TAG} already has the verified candidate assets.`);
            core.setOutput('should_publish', 'false');

      - name: Publish release without rebuilding
        if: steps.release-preflight.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
