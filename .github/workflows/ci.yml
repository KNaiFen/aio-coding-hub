name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      build_release_candidate:
        description: Build a signed candidate for the current main commit
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
      docs_checks: ${{ steps.scope.outputs.docs_checks }}
      provider_trend_benchmark: ${{ steps.scope.outputs.provider_trend_benchmark }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BEFORE_SHA: ${{ github.event.before || '' }}
        run: >-
          node scripts/ci-change-scope.mjs
          --event "$CI_EVENT_NAME"
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --before "$CI_BEFORE_SHA"

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|chore|style|refactor|perf|test|ci|build|revert)(\([^)]+\))?: .+'
          [[ "$PR_TITLE" =~ $pattern ]] || {
            echo "::error::PR title must use Conventional Commits."
            exit 1
          }

  docs-contract:
    needs: change-scope
    if: needs.change-scope.outputs.docs_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate plugin documentation
        run: node scripts/check-plugin-system-docs.mjs

      - name: Validate plugin API contract
        run: node scripts/check-plugin-api-contract.mjs

      - name: Validate Trellis spec links
        run: node scripts/check-spec-links.mjs

      - name: Validate standalone TUI release contract
        run: node scripts/check-tui-release-contract.mjs

  support-contract:
    needs: change-scope
    if: needs.change-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate CI change-scope classifier
        run: node scripts/ci-change-scope.selftest.mjs

      - name: Validate release source resolution
        run: node scripts/release-source.selftest.mjs

      - name: Validate upstream sync policy self-test
        run: node scripts/check-sync-upstream-policy.selftest.mjs

      - name: Enforce upstream sync manual-review policy
        run: node scripts/check-sync-upstream-policy.mjs

      - name: Validate release promotion integrity
        run: node scripts/release-promotion.selftest.mjs

      - name: Reject local native-build entry points
        run: node scripts/check-local-build-entrypoints.mjs

      - name: Validate Homebrew Cask generator
        run: node scripts/support-matrix.homebrew-cask.selftest.mjs

      - name: Validate standalone TUI release contract
        run: node scripts/check-tui-release-contract.mjs

  frontend:
    needs: [change-scope, support-contract]
    if: needs.change-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit:deps

      - name: Lint
        run: pnpm lint

      - name: Gateway error codes
        run: pnpm check:gateway-error-codes

      - name: Plugin docs contract
        run: pnpm check:plugin-system-docs

      - name: Plugin API contract
        run: pnpm check:plugin-api-contract

      - name: Plugin TypeScript SDK typecheck
        run: pnpm plugin-sdk:typecheck

      - name: Plugin TypeScript SDK tests
        run: pnpm plugin-sdk:test

      - name: Plugin scaffolder tests
        run: pnpm --filter create-aio-plugin test

      - name: Plugin GUI E2E smoke
        run: pnpm test:e2e

      - name: Unit tests
        run: pnpm test:unit:coverage

      - name: Build frontend
        run: pnpm build

  rust:
    needs: [change-scope, support-contract]
    if: needs.change-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev librsvg2-dev patchelf
          if ! sudo apt-get install -y libayatana-appindicator3-dev; then
            sudo apt-get install -y libappindicator3-dev
          fi
          if ! sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript formatting dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - id: canonicalize
        name: Format Rust and generate bindings in the cloud
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo update --manifest-path src-tauri/Cargo.toml --workspace
          cargo run --manifest-path src-tauri/Cargo.toml --locked --example export-bindings
          pnpm exec prettier --write src/generated/bindings.ts
          if git diff --quiet -- src-tauri src/generated/bindings.ts; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary -- src-tauri src/generated/bindings.ts > cloud-native-fixes.patch
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated-file fixes
        if: steps.canonicalize.outputs.drift == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-native-fixes-${{ github.sha }}-${{ github.run_attempt }}
          path: cloud-native-fixes.patch
          if-no-files-found: error
          retention-days: 7

      - name: Fail on generated-file drift
        if: steps.canonicalize.outputs.drift == 'true'
        run: |
          echo "Cloud formatting or generated bindings changed; apply the uploaded patch." >&2
          exit 1

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Provider trend million-row release benchmark
        if: needs.change-scope.outputs.provider_trend_benchmark == 'true'
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: "1"
        run: >-
          cargo test --release --locked --lib
          provider_trend_million_ledger_rows_release_under_one_second --
          --ignored --test-threads=1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Dependency audit
        working-directory: src-tauri
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  candidate-plan:
    needs: change-scope
    if: >-
      needs.change-scope.outputs.full_ci == 'true' &&
      github.repository == 'KNaiFen/aio-coding-hub' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - id: plan
        name: Detect a version change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BUILD: ${{ inputs.build_release_candidate == true }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag="aio-coding-hub-v$version"
          should_build=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_BUILD" == "true" ]]; then
            should_build=true
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            if ! git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            previous_version="$(git show "$BEFORE_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            [[ "$version" == "$previous_version" ]] || should_build=true
          fi

          node scripts/support-matrix.mjs validate-release-version --tag "$tag"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-release-candidate:
    needs: [support-contract, frontend, rust, candidate-plan]
    if: needs.candidate-plan.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            updater_platform: windows-x86_64
            stable_label: win64
            portable_asset_name: aio-coding-hub-win64-portable.zip
          - target_id: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            updater_platform: darwin-aarch64
            stable_label: macos-arm
            portable_asset_name: aio-coding-hub-macos-arm.zip
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          normalized_key="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" | tr -d '\r\n\t ')"
          [[ -n "$normalized_key" ]] || {
            echo "Required updater signing key is unavailable." >&2
            exit 1
          }
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" ]] || {
            echo "Required updater signing password is unavailable." >&2
            exit 1
          }
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          key_path="$temp_dir/tauri-updater.key"
          test_path="$temp_dir/signing-probe.txt"
          printf '::add-mask::%s\n' "$normalized_key"
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$normalized_key" >> "$GITHUB_ENV"
          printf '%s' "$normalized_key" > "$key_path"
          chmod 600 "$key_path"
          printf '%s\n' 'signing-probe' > "$test_path"
          pnpm exec tauri signer sign \
            -f "$key_path" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" \
            "$test_path" >/dev/null 2>&1

      - id: tauri
        name: Build signed Tauri candidate
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.updater_platform, 'darwin-') && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          includeUpdaterJson: false

      - name: Prepare updater assets
        shell: bash
        env:
          ARTIFACT_PATHS_JSON: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          node scripts/support-matrix.mjs prepare-stable-assets \
            --artifact-paths "$ARTIFACT_PATHS_JSON" \
            --updater-platform "${{ matrix.updater_platform }}" \
            --stable-label "${{ matrix.stable_label }}" \
            --output-dir stable-assets

      - name: Build macOS portable ZIP
        if: startsWith(matrix.updater_platform, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          tarball="stable-assets/aio-coding-hub-${{ matrix.stable_label }}.tar.gz"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          tar -xzf "$tarball" -C "$temp_dir"
          app_path="$(find "$temp_dir" -maxdepth 2 -name '*.app' -type d -print -quit)"
          [[ -n "$app_path" ]]
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "stable-assets/${{ matrix.portable_asset_name }}"

      - name: Build Windows portable ZIP
        if: startsWith(matrix.updater_platform, 'windows-')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDir = "src-tauri/target/${{ matrix.target }}/release"
          $exePath = Join-Path $targetDir "AIO Coding Hub.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = Join-Path $targetDir "aio-coding-hub.exe"
          }
          if (-not (Test-Path $exePath)) {
            throw "Cannot find built application executable in $targetDir"
          }
          $portableDir = "portable-build/AIO Coding Hub"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $exePath $portableDir
          $resourceDir = Join-Path $targetDir "resources"
          if (Test-Path $resourceDir) {
            Copy-Item -Recurse $resourceDir (Join-Path $portableDir "resources")
          }
          Compress-Archive -Path "$portableDir/*" -DestinationPath "stable-assets/${{ matrix.portable_asset_name }}" -Force

      - name: Upload platform candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: stable-assets/*
          if-no-files-found: error
          retention-days: 1

  build-tui-release-candidate:
    needs: [support-contract, frontend, rust, candidate-plan]
    if: needs.candidate-plan.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: aio-tui-win64.zip
          - target_id: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            asset_name: aio-tui-macos-intel.tar.gz
          - target_id: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            asset_name: aio-tui-macos-arm.tar.gz
          - target_id: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: aio-tui-linux-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Build standalone TUI
        shell: bash
        run: >-
          cargo build
          --manifest-path src-tauri/Cargo.toml
          --package aio-tui
          --release
          --locked
          --target ${{ matrix.target }}

      - name: Package standalone TUI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tui-assets
          tar -czf "tui-assets/${{ matrix.asset_name }}" \
            -C "src-tauri/target/${{ matrix.target }}/release" aio-tui

      - name: Package standalone TUI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path tui-assets -Force | Out-Null
          $binary = "src-tauri/target/${{ matrix.target }}/release/aio-tui.exe"
          if (-not (Test-Path $binary)) {
            throw "Cannot find built TUI executable at $binary"
          }
          Compress-Archive -Path $binary -DestinationPath "tui-assets/${{ matrix.asset_name }}" -Force

      - name: Upload TUI candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tui-platform-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: tui-assets/*
          if-no-files-found: error
          retention-days: 1

  assemble-release-candidate:
    needs: [frontend, rust, candidate-plan, build-release-candidate, build-tui-release-candidate]
    if: >-
      always() &&
      needs.candidate-plan.outputs.should_build == 'true' &&
      needs.frontend.result == 'success' &&
      needs.rust.result == 'success' &&
      needs.build-release-candidate.result == 'success' &&
      needs.build-tui-release-candidate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download platform candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-${{ github.sha }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: release-assets

      - name: Download TUI candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tui-platform-${{ github.sha }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: release-assets

      - name: Generate updater metadata and checksums
        shell: bash
        env:
          FALLBACK_NOTES: See release ${{ needs.candidate-plan.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/support-matrix.mjs generate-latest-json \
            --tag "${{ needs.candidate-plan.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --stable-assets-dir release-assets \
            --target-ids windows-x64,macos-arm64 \
            --output release-assets/latest.json
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - change-scope
      - pr-title
      - docs-contract
      - support-contract
      - frontend
      - rust
      - candidate-plan
      - build-release-candidate
      - build-tui-release-candidate
      - assemble-release-candidate
    runs-on: ubuntu-latest
    steps:
      - name: Require expected jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE: ${{ needs.change-scope.outputs.scope }}
          FULL_CI: ${{ needs.change-scope.outputs.full_ci }}
          DOCS_CHECKS: ${{ needs.change-scope.outputs.docs_checks }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          DOCS_RESULT: ${{ needs.docs-contract.result }}
          SUPPORT_RESULT: ${{ needs.support-contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PLAN_RESULT: ${{ needs.candidate-plan.result }}
          SHOULD_BUILD: ${{ needs.candidate-plan.outputs.should_build }}
          BUILD_RESULT: ${{ needs.build-release-candidate.result }}
          TUI_BUILD_RESULT: ${{ needs.build-tui-release-candidate.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble-release-candidate.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGE_SCOPE_RESULT" == "success" ]]
          [[ "$FULL_CI" == "true" || "$FULL_CI" == "false" ]]
          [[ "$DOCS_CHECKS" == "true" || "$DOCS_CHECKS" == "false" ]]

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_TITLE_RESULT" == "success" ]]
          else
            [[ "$PR_TITLE_RESULT" == "skipped" ]]
          fi

          if [[ "$DOCS_CHECKS" == "true" ]]; then
            [[ "$DOCS_RESULT" == "success" ]]
          else
            [[ "$DOCS_RESULT" == "skipped" ]]
          fi

          if [[ "$FULL_CI" == "true" ]]; then
            [[ "$SCOPE" == "full" ]]
            [[ "$SUPPORT_RESULT" == "success" ]]
            [[ "$FRONTEND_RESULT" == "success" ]]
            [[ "$RUST_RESULT" == "success" ]]
            if [[ "$EVENT_REF" == "refs/heads/main" && ( "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ) ]]; then
              [[ "$PLAN_RESULT" == "success" ]]
              if [[ "$SHOULD_BUILD" == "true" ]]; then
                [[ "$BUILD_RESULT" == "success" ]]
                [[ "$TUI_BUILD_RESULT" == "success" ]]
                [[ "$ASSEMBLE_RESULT" == "success" ]]
              else
                [[ "$BUILD_RESULT" == "skipped" ]]
                [[ "$TUI_BUILD_RESULT" == "skipped" ]]
                [[ "$ASSEMBLE_RESULT" == "skipped" ]]
              fi
            else
              [[ "$PLAN_RESULT" == "skipped" ]]
              [[ "$BUILD_RESULT" == "skipped" ]]
              [[ "$TUI_BUILD_RESULT" == "skipped" ]]
              [[ "$ASSEMBLE_RESULT" == "skipped" ]]
            fi
          else
            if [[ "$DOCS_CHECKS" == "true" ]]; then
              [[ "$SCOPE" == "checked-docs" ]]
            else
              [[ "$SCOPE" == "process-docs" ]]
            fi
            [[ "$SUPPORT_RESULT" == "skipped" ]]
            [[ "$FRONTEND_RESULT" == "skipped" ]]
            [[ "$RUST_RESULT" == "skipped" ]]
            [[ "$PLAN_RESULT" == "skipped" ]]
            [[ "$BUILD_RESULT" == "skipped" ]]
            [[ "$TUI_BUILD_RESULT" == "skipped" ]]
            [[ "$ASSEMBLE_RESULT" == "skipped" ]]
          fi
