<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIO Float 设置</title><link rel="stylesheet" href="float.css"></head>
<body class="settings"><h1>AIO Float</h1><form id="connection"><section><h2>连接</h2>
<label>IP 地址<input id="ip" required autocomplete="off" value="127.0.0.1"></label><label>端口<input id="port" type="number" min="1" max="65535" required value="13799"></label><label>访问令牌<input id="token" type="password" autocomplete="off"></label><div class="actions"><button id="connect" type="submit">测试并保存连接</button></div><p id="connection-error" class="error" role="status"></p>
</section></form><form id="appearance"><section><h2>外观</h2><label>字号<input id="fontSize" type="number" min="8" max="32" step="1" required value="12"></label><label>背景颜色<input id="background" type="color" value="#272b33"></label><label>背景不透明度<span class="range"><input id="opacity" type="range" min="0" max="100" value="100"><output id="opacity-value">100%</output></span></label><label>始终置顶<input id="alwaysOnTop" type="checkbox" checked></label><label>鼠标穿透<input id="clickThrough" type="checkbox"></label><div class="actions"><button type="submit">应用外观</button></div><p id="appearance-error" class="error" role="status"></p></section></form><script type="module" src="settings.js"></script></body></html>
