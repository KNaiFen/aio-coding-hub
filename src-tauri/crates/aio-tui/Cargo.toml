[package]
name = "aio-tui"
version = "0.60.45"
edition = "2021"
publish = false

[[bin]]
name = "aio-tui"
path = "src/main.rs"

[dependencies]
aio-observer-protocol = { path = "../aio-observer-protocol" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12.28", default-features = false, features = ["stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"
